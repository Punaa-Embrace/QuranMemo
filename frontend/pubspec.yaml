name: quranmemo
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:

  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  video_player: ^2.8.3

  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # Database Lokal Untuk Surah, Ayat, Qari
  sqflite: ^2.3.0      
  path: ^1.9.0     

  flutter:
    sdk: flutter

  dio : ^5.3.2

  font_awesome_flutter: ^10.4.0
  # Font Arabic
  arabic_font: ^0.0.9
  
  # API Calls
  http: ^1.1.0
  
  shared_preferences: ^2.1.1
  # Icon Islamic
  flutter_islamic_icons: ^1.0.0
  # Caching gambar
  cached_network_image: ^3.3.1
  
  # Audio players
  audioplayers: ^6.1.0 

  # Camera (buat nyetor)
  camera: ^0.10.5

  permission_handler: ^11.3.0
  
  # Icons
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/QuranNoText.png"
  min_sdk_android: 21 

flutter_native_splash:
  color: "#F5E2D1"
  image: "assets/images/QuranNoText.png"
  android_12:
    image: "assets/images/QuranNoText.png"
    icon_background_color: "#F5E2D1"

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/images/Header.png
    - assets/images/Pelajari.png
    - assets/images/QuranMemo.png
    - assets/images/QuranNoText.png
    - assets/images/Riwayat-Hfl.png
    - assets/images/Setor.png
    - assets/images/SambungAyat.png

    - assets/images/self.jpg